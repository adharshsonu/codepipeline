version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: "612565767098"
    AWS_DEFAULT_REGION: "us-east-1"
    RAILS_REPO: "rails"
    NGINX_REPO: "nginx"
    PROJECT_NAME: "ror-app"

phases:
  pre_build:
    commands:
      - echo "Installing Docker if not available..."
      - |
        if ! command -v docker &> /dev/null; then
          echo "Docker not found, installing..."
          yum update -y
          yum install -y docker
          service docker start
          usermod -a -G docker ec2-user
        fi
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

  build:
    commands:
      - echo "Building Docker images..."
      - echo "Current directory: $(pwd)"
      - echo "Contents of current directory:"
      - ls -la
      - echo "Building Rails image..."
      - docker build -t $RAILS_REPO -f docker/app/Dockerfile .
    finally:
      - echo "Docker build phase finished. Listing available images:"
      - docker images

  post_build:
    commands:
      - echo "Pushing Docker Images"
      - docker tag $RAILS_REPO:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$RAILS_REPO:latest
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$RAILS_REPO:latest
      - echo "Building and pushing Nginx image..."
      - docker build -t $NGINX_REPO -f docker/nginx/Dockerfile .
      - docker tag $NGINX_REPO:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$NGINX_REPO:latest
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$NGINX_REPO:latest
      - echo "Docker Images have been pushed successfully"
      - echo "Creating imagedefinitions.json file..."
      - printf '[{"name":"rails","imageUri":"%s"},{"name":"nginx","imageUri":"%s"}]' $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$RAILS_REPO:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$NGINX_REPO:latest > imagedefinitions.json
      - echo "Contents of imagedefinitions.json:"
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json