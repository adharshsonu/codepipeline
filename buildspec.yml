version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: "612565767098"
    AWS_DEFAULT_REGION: "ap-south-1"
    PROJECT_NAME: "ror-app"
    RAILS_REPO: "rails"
    NGINX_REPO: "nginx"

phases:
  install:
    commands:
      - echo "Installing dependencies..."
      - yum install -y jq

  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - echo "Checking if ECR repositories exist..."
      - |
        aws ecr describe-repositories --repository-names $RAILS_REPO || \
        aws ecr create-repository --repository-name $RAILS_REPO
      - |
        aws ecr describe-repositories --repository-names $NGINX_REPO || \
        aws ecr create-repository --repository-name $NGINX_REPO

  build:
    commands:
      - echo "Building Docker images..."
      - docker build -t $PROJECT_NAME-rails ./ror-app
      - docker tag $PROJECT_NAME-rails:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$RAILS_REPO:latest
      - docker build -t $PROJECT_NAME-nginx ./nginx
      - docker tag $PROJECT_NAME-nginx:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$NGINX_REPO:latest

  post_build:
    commands:
      - echo "Pushing Docker images to ECR..."
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$RAILS_REPO:latest
      - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$NGINX_REPO:latest
      - echo "Build and push completed on `date`"

artifacts:
  files:
    - '**/*'
  discard-paths: yes
