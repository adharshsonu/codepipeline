version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: "612565767098"
    AWS_DEFAULT_REGION: "ap-south-1"
    RAILS_REPO: "rails"
    NGINX_REPO: "nginx"
    PROJECT_NAME: "ror-app"

phases:
  pre_build:
    commands:
      - echo "Installing Docker if not available..."
      # Docker is usually pre-installed on CodeBuild, but verify
      - |
        if ! command -v docker &> /dev/null; then
          echo "Docker not found, installing..."
          yum update -y
          yum install -y docker
          service docker start
          usermod -a -G docker ec2-user
        fi
      # Optional: Docker Hub login (set DOCKER_USERNAME and DOCKER_PASSWORD in CodeBuild env variables if you use it)
      - if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then echo $DOCKER_PASSWORD | docker login --username $DOCKER_USERNAME --password-stdin; fi
      - echo "Logging in to Amazon ECR..."
     

  build:
    commands:
      - echo "Building Docker images..."
      - docker build -t $RAILS_REPO -f docker/app/Dockerfile .
      - docker build -t $NGINX_REPO -f docker/nginx/Dockerfile .

  post_build:
    commands:
      post_build:
  commands:
    - echo "Pushing Docker Images"
    - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
    - docker tag $RAILS_REPO:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$RAILS_REPO:latest
    - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$RAILS_REPO:latest
    - docker tag $NGINX_REPO:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$NGINX_REPO:latest
    - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$NGINX_REPO:latest
    - echo "Docker Images have been pushed successfully"
    - echo "Creating imagedefinitions.json file..."
    - printf '[{"name":"%s","imageUri":"%s.dkr.ecr.%s.amazonaws.com/%s:latest"},{"name":"%s","imageUri":"%s.dkr.ecr.%s.amazonaws.com/%s:latest"}]' \
      "$RAILS_REPO" "$AWS_ACCOUNT_ID" "$AWS_DEFAULT_REGION" "$RAILS_REPO" \
      "$NGINX_REPO" "$AWS_ACCOUNT_ID" "$AWS_DEFAULT_REGION" "$NGINX_REPO" > imagedefinitions.json


artifacts:
  files: imagedefinitions.json
