version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: "612565767098"
    AWS_DEFAULT_REGION: "ap-south-1"
    RAILS_REPO: "rails"
    NGINX_REPO: "nginx"

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - $(aws ecr get-login --no-include-email --region $AWS_DEFAULT_REGION)
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG=${COMMIT_HASH:=latest}
      - RAILS_REPO_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$RAILS_REPO
      - NGINX_REPO_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$NGINX_REPO

  build:
    commands:
      - echo Build started on `date`
      - echo Building Rails image...
      - docker build -t $RAILS_REPO_URI:latest -t $RAILS_REPO_URI:$IMAGE_TAG ./docker/app
      - echo Building Nginx image...
      - docker build -t $NGINX_REPO_URI:latest -t $NGINX_REPO_URI:$IMAGE_TAG ./docker/nginx

  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing Rails image...
      - docker push $RAILS_REPO_URI:latest
      - docker push $RAILS_REPO_URI:$IMAGE_TAG
      - echo Pushing Nginx image...
      - docker push $NGINX_REPO_URI:latest
      - docker push $NGINX_REPO_URI:$IMAGE_TAG
      - echo Writing imagedefinitions.json...
      - printf '[{"name":"rails_app","imageUri":"%s"},{"name":"nginx","imageUri":"%s"}]' $RAILS_REPO_URI:$IMAGE_TAG $NGINX_REPO_URI:$IMAGE_TAG > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
